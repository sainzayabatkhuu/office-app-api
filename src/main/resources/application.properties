spring.application.name=office-app
application.version=0.0.1
server.port=${SERVER_PORT:8086}

# Local overrides (secrets for your machine). Not committed; see application-local.properties.example.
spring.config.import=optional:file:./application-local.properties

# ---- Database (set DB_URL / DB_USERNAME / DB_PASSWORD in the environment or application-local.properties)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/oracleflexcube}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Security
# HMAC key for access tokens, at least 32 bytes. Required: startup fails without it.
security.jwt.secret-key=${JWT_SECRET:}
# Access token: 30 minutes (ms). The front-end renews it with the refresh token.
security.jwt.expiration-time=${JWT_EXPIRATION_MS:1800000}
# Refresh token: 7 days (ms)
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Temporary lock after this many consecutive failures; permanent lock (admin unlock) after the second number.
security.jwt.login.attemps=5
security.jwt.login.permanent-lock-attempts=10
# Temporary lock duration: 15 minutes (ms)
security.jwt.lock.time=900000
# Front-end origins allowed by CORS and the WebSocket endpoint (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:3000}

# ---- Reports
report.subreport.dir=uploads/reports/jrxml/
report.output.dir=generated_reports/
# Background (B) report generation threads
report.async.pool-size=${REPORT_ASYNC_POOL_SIZE:4}

logging.level.com.sol.office_app=INFO
