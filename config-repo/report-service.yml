spring:
  datasource:
    url: jdbc:mysql://${office.db.host}:${office.db.port}/office_report?${office.db.options}
    username: ${office.db.username}
    password: ${office.db.password}

office:
  report:
    # Database the report templates query (e.g. the core-banking/reporting replica). Read-only access is enough.
    datasource:
      url: ${REPORT_DB_URL:jdbc:mysql://${office.db.host}:${office.db.port}/office_report?${office.db.options}}
      username: ${REPORT_DB_USERNAME:${office.db.username}}
      password: ${REPORT_DB_PASSWORD:${office.db.password}}
      hikari:
        maximum-pool-size: ${REPORT_DB_POOL_SIZE:10}
        read-only: true
        pool-name: reporting-pool
    storage:
      base-dir: ${REPORT_STORAGE_DIR:./data/report-storage}
    execution:
      # Max concurrent report fills per instance (Jasper is CPU and memory heavy).
      max-concurrent: ${REPORT_MAX_CONCURRENT:4}
      sync-timeout: 120s
      output-retention-days: 30

spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 10000
  circuitbreaker:
    enabled: true
