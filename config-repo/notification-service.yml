spring:
  datasource:
    url: jdbc:mysql://${office.db.host}:${office.db.port}/office_notification?${office.db.options}
    username: ${office.db.username}
    password: ${office.db.password}

office:
  security:
    public-paths:
      - /ws/**          # STOMP CONNECT is authenticated by the channel interceptor
  notification:
    retention-days: 90
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4300,http://localhost:3000,http://localhost:5173,http://localhost:8080}
