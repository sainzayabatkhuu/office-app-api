global:
  scrape_interval: 15s

scrape_configs:
  # Discovers every service instance from Eureka, so scaled replicas are scraped automatically.
  - job_name: office-services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://discovery-server:8761/eureka
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
